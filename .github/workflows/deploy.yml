# Despliega HappyTimesBalloons en EC2 (us-east-2) cada vez que se hace push a main.
# Replica el flujo de publicar.ps1: MSBuild → empaquetar.ps1 → S3 temporal → SSM desplegar.ps1.
#
# Secrets requeridos en el repositorio de GitHub:
#   AWS_ACCESS_KEY_ID      — access key de un IAM user con permisos S3 + SSM (ver README)
#   AWS_SECRET_ACCESS_KEY  — secret key del mismo IAM user

name: Deploy to AWS EC2

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # espera a que termine el deploy en curso antes de iniciar otro

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes NuGet
        run: nuget restore happy_time_balloons\HappyTimesBalloons.sln
        shell: pwsh

      - name: Compilar en Release
        run: |
          msbuild happy_time_balloons\HappyTimesBalloons.Web\HappyTimesBalloons.Web.csproj `
            /p:Configuration=Release /v:minimal /nologo /clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { throw "Fallo la compilacion" }
        shell: pwsh

      - name: Empaquetar
        run: |
          $proyecto = "${{ github.workspace }}\happy_time_balloons\HappyTimesBalloons.Web"
          $salida   = "$env:RUNNER_TEMP\publish"
          $zip      = "$env:RUNNER_TEMP\happy-balloons-web.zip"

          & "${{ github.workspace }}\happy_time_balloons\.claude\deploy\aws\empaquetar.ps1" `
              -Proyecto $proyecto -Salida $salida

          Compress-Archive -Path "$salida\*" -DestinationPath $zip -Force
          Write-Output "ZIP generado: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"
          "ZIP_PATH=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-2

      - name: Subir a S3 y generar URL firmada
        run: |
          $bucket = "happy-balloons-deploy-613852762704"

          # Crear bucket temporal (ignora error si ya existe por un run anterior fallido)
          aws s3api create-bucket --bucket $bucket `
            --create-bucket-configuration "LocationConstraint=us-east-2" 2>$null
          $LASTEXITCODE = 0

          aws s3 cp $env:ZIP_PATH "s3://$bucket/happy-balloons-web.zip" --only-show-errors
          if ($LASTEXITCODE -ne 0) { throw "Fallo la subida a S3" }

          $url = aws s3 presign "s3://$bucket/happy-balloons-web.zip" --expires-in 3600
          "S3_URL=$url"       | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "S3_BUCKET=$bucket" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: Enviar comando SSM al EC2
        run: |
          $script = (Get-Content `
            "${{ github.workspace }}\happy_time_balloons\.claude\deploy\aws\desplegar.ps1" `
            -Raw).Replace('{{ZIP_URL}}', $env:S3_URL)

          $params  = @{
            commands         = @($script -split "`r?`n")
            executionTimeout = @('1200')
          } | ConvertTo-Json -Depth 3
          $archivo = "$env:RUNNER_TEMP\ssm-params.json"
          [IO.File]::WriteAllText($archivo, $params)

          $id = aws ssm send-command `
            --instance-ids i-09494e479f8e0a053 `
            --document-name AWS-RunPowerShellScript `
            --comment "Deploy GitHub Actions - $env:GITHUB_SHA" `
            --parameters "file://$archivo" `
            --query Command.CommandId --output text
          Remove-Item $archivo

          if ($LASTEXITCODE -ne 0) { throw "Fallo ssm send-command" }
          Write-Output "SSM Command ID: $id"
          "COMMAND_ID=$id" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: Esperar resultado del deploy en EC2
        run: |
          $id         = $env:COMMAND_ID
          $instanceId = "i-09494e479f8e0a053"
          $pendientes = @('Pending', 'InProgress', 'Delayed')

          do {
            Start-Sleep -Seconds 15
            $estado = aws ssm get-command-invocation `
              --command-id $id --instance-id $instanceId `
              --query Status --output text 2>$null
            Write-Output "[$((Get-Date -Format 'HH:mm:ss'))] $estado"
          } while (-not $estado -or $estado -in $pendientes)

          Write-Output "--- Output del servidor ---"
          aws ssm get-command-invocation `
            --command-id $id --instance-id $instanceId `
            --query '[StandardOutputContent, StandardErrorContent]' `
            --output text

          if ($estado -ne 'Success') { throw "Deploy fallido con estado: $estado" }
          Write-Output "Deploy completado: http://13.184.33.122"
        shell: pwsh

      - name: Limpiar bucket S3 temporal
        if: always()
        run: |
          if ($env:S3_BUCKET) {
            aws s3 rb "s3://$env:S3_BUCKET" --force --region us-east-2
          }
        shell: pwsh
